# 污核：BOSS。慢且巨大，靠体型压迫
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程

kind: boss          # 种类，必须和文件名一致（新增种类要改代码）
name: 污核          # 名称（控制台、调试信息里显示）
hp: 220             # 血量
speed: 42           # 移动速度，像素/秒（玩家走路 80、奔跑 140）
radius: 12          # 碰撞半径，也是身体半宽，像素
height: 24          # 身体画出来多高（从脚底往上），像素。子弹的受创框 = 宽 2×radius、高 height
damage: 18          # 接触伤害
touch_cd: 1         # 同一只两次接触伤害的间隔，秒
