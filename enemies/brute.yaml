# 重胎：更慢但耐打
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程

kind: brute         # 种类，必须和文件名一致（新增种类要改代码）
name: 重胎          # 名称（控制台、调试信息里显示）
hp: 60              # 血量
speed: 34           # 移动速度，像素/秒（玩家走路 80、奔跑 140）
radius: 8           # 碰撞半径，也是身体半宽，像素
height: 16          # 身体画出来多高（从脚底往上），像素。子弹的受创框 = 宽 2×radius、高 height
damage: 12          # 接触伤害
touch_cd: 1.1       # 同一只两次接触伤害的间隔，秒
