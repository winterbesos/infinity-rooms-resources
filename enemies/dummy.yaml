# 木桩：训练场木桩：不动、不碰人、打不死（血打空当场回满）。血量取 100，血条掉多少一眼就是百分之几
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程

kind: dummy         # 种类，必须和文件名一致（新增种类要改代码）
name: 木桩          # 名称（控制台、调试信息里显示）
hp: 100             # 血量
speed: 0            # 移动速度，像素/秒（玩家走路 80、奔跑 140）
radius: 6           # 碰撞半径，也是身体半宽，像素
height: 22          # 身体画出来多高（从脚底往上），像素。子弹的受创框 = 宽 2×radius、高 height
damage: 0           # 接触伤害
touch_cd: 1         # 同一只两次接触伤害的间隔，秒
