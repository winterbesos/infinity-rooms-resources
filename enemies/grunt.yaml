# 碎屑：杂兵。比玩家走路(80)慢一点，跑得掉
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程

kind: grunt         # 种类，必须和文件名一致（新增种类要改代码）
name: 碎屑          # 名称（控制台、调试信息里显示）
hp: 20              # 血量
speed: 52           # 移动速度，像素/秒（玩家走路 80、奔跑 140）
radius: 5           # 碰撞半径，也是身体半宽，像素
height: 10          # 身体画出来多高（从脚底往上），像素。子弹的受创框 = 宽 2×radius、高 height
damage: 6           # 接触伤害
touch_cd: 0.8       # 同一只两次接触伤害的间隔，秒
