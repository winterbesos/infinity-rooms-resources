# 风暴之弓（名称、格子、掉率在 items.json 里改）
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程

id: storm_bow        # 道具 id，必须和文件名一致
weapon_type: ranged  # melee 近战挥砍 / ranged 远程射击
damage: 14           # 每一击（每发子弹）的伤害
attack_speed: 1.4    # 每秒攻击次数，冷却 = 1 / 它
crit_rate: 0.15      # 暴击率 0~1（暂未生效）
crit_damage: 1.5     # 暴击倍率（暂未生效）
attack_range: 240    # 近战够得着多远 / 子弹能飞多远，像素
knockback: 60        # 击退力度（暂未生效）
swing_arc: 0         # 近战扇形张角（整个扇面），度，0 = 一条直线
max_targets: 1       # 近战一下最多同时打中几只
pierce_walls: false  # 近战能不能隔墙打到
hit_delay: 0         # 近战出手到结算伤害的延迟，秒
bullet_speed: 450    # 子弹飞行速度，像素/秒
magazine_size: 12    # 弹匣容量，发
reload_seconds: 1.2  # 换弹时间，秒
