# 普通僵尸：慢吞吞地追人，打腿能把它打瘸
# 字段说明见 README.md；改完跑 tools/sync_resources.sh 同步进两个工程（也可以用内容工作台的「僵尸」页改）

id: walker                # 僵尸 id，必须和文件名一致
name: 普通僵尸            # 名称（控制台、调试信息里显示）

# ── 基础 ──
hp: 40                    # 血量
speed: 30                 # 站着时的移速，像素/秒（玩家走路 80）
radius: 6                 # 地面碰撞半径（挡路、贴身扣血的距离）
damage: 8                 # 接触伤害
touch_cd: 1.0             # 同一只两次接触伤害的间隔，秒

# ── 刷怪（剩下的预算里和碎屑、别的僵尸按权重抢）──
spawn_rooms: normal,elite,boss,final_boss  # 出现在哪些房型，逗号分隔
spawn_min_day: 1          # 从第几天开始出现
spawn_weight: 10          # 权重（碎屑是 10），0 = 不刷
spawn_cost: 1.5           # 占多少预算（碎屑 1、重胎 2.5）

# ── 部位伤害倍率（近战一律算身体）──
head_mult: 2.0            # 爆头
body_mult: 1.0
legs_mult: 0.8

# ── 站着时的判定框：像素，相对脚底，按朝右写（朝左自动镜像）──
# x = 框中心往前偏多少　y = 框底边离地多高　w / h = 宽、高
head_x: 0
head_y: 22
head_w: 8
head_h: 8
body_x: 0
body_y: 10
body_w: 12
body_h: 12
legs_x: 0
legs_y: 0
legs_w: 10
legs_h: 10

# ── 瘸腿：腿上累计挨到这么多伤害（算完倍率）就瘸，0 = 打不瘸 ──
leg_threshold: 20
crippled_speed: 12        # 瘸了之后的移速

# ── 瘸腿后的判定框（趴着爬：头在前，腿拖在后面）──
crippled_head_x: 9
crippled_head_y: 0
crippled_head_w: 7
crippled_head_h: 7
crippled_body_x: 0
crippled_body_y: 0
crippled_body_w: 12
crippled_body_h: 7
crippled_legs_x: -9
crippled_legs_y: 0
crippled_legs_w: 10
crippled_legs_h: 5

# ── 动画（纯表现，服务端不读，不进哈希）。图集放在 zombies/walker/ 下 ──
# 一张精灵表按 帧宽×帧高 切成 列×行 格，帧号从 0 起按行从左往右数；foot_x / foot_y 是帧里脚底那个像素
# 每个动作一串帧序列："0-3"、"4,5,6,5"、"11-8"（倒放）。空 = 不用（待机空着就停在行走的第一帧）
# 图集留空 = 还没有美术，游戏里用判定框画占位小人
anim_file: walk.png
anim_frame_w: 64
anim_frame_h: 64
anim_cols: 8
anim_rows: 16
anim_foot_x: 32
anim_foot_y: 63
anim_faces_left: true     # 素材里的僵尸朝左画的就填 true
anim_idle_frames: 0-4     # 站着不动
anim_idle_fps: 4
anim_walk_frames: 32-39   # 走
anim_walk_fps: 8
anim_crippled_idle_frames: "52" # 瘸了趴着不动
anim_crippled_idle_fps: 3
anim_crippled_frames: 51,52 # 瘸了往前爬
anim_crippled_fps: 3
